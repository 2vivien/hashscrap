services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hashscrap}
      POSTGRES_USER: ${POSTGRES_USER:-hashscrap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hashscrap} -d ${POSTGRES_DB:-hashscrap}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - database
    mem_limit: 1024m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["hashscrap", "serve", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      HASHSCRAP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hashscrap}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hashscrap}
    depends_on:
      db:
        condition: service_healthy
    # Host loopback only: the API is read-only and carries no authentication yet.
    # The host port is overridable because 8000 is frequently taken by another service.
    ports:
      - "127.0.0.1:${HASHSCRAP_API_PORT:-8001}:8000"
    networks:
      - database
    mem_limit: 512m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    environment:
      HASHSCRAP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hashscrap}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hashscrap}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - database
      - egress
    mem_limit: 768m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid

volumes:
  postgres_data:

networks:
  database:
    internal: true
  egress:
    driver: bridge
